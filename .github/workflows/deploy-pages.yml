# Deploy the server-less dashboard to GitHub Pages.
#
# The site is the SPA + static_api.js + every data artifact, served same-origin
# from Pages' CDN — no cold starts, no runtime computation, nothing to fail at
# request time. Data freshness comes from re-deploying after each nightly
# refresh (workflow_run); code freshness from deploying on push to main.
#
# ONE-TIME SETUP (repo owner): Settings → Pages → Source: "GitHub Actions".
# Until that's flipped, deploys fail with "Pages site not found" — harmless.
#
# build_pages_site.py refuses to assemble an incomplete site (missing year
# files or artifacts), so a flaky release download can never publish a
# silently-broken deploy — the previous good deploy just stays live.
#
# The deploy step is retried twice (see below): GitHub's Pages backend
# occasionally leaves a deployment in `deployment_queued` until the action's
# poll timeout, which otherwise means one platform flake = a full day of stale
# data, since nothing re-runs this workflow until the next nightly.

name: Deploy Pages site

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Nightly data refresh", "Re-scrape elections (parish-qualified)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # For workflow_run triggers, only deploy after a SUCCESSFUL nightly —
    # a failed refresh keeps the previous good site live.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Fall back to the retries' URL — when an attempt times out its
      # page_url output is empty.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Seed data from the data-cache release
        # Authenticate the GitHub API metadata fetch: unauthenticated calls
        # share a 60/hour limit per runner IP and intermittently 403, seeding
        # nothing and tripping the completeness gate below.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fetch_cache_assets.py

      - name: Assemble site (with completeness gate)
        run: python build_pages_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Up to three attempts. deploy-pages waits at most 10 minutes for a
      # deployment (it clamps any larger `timeout`), then cancels it and fails.
      # Each invocation creates a fresh Pages deployment from the already-
      # uploaded artifact, so re-running it is safe (not a double-publish).
      #
      # Every attempt in a run shares one deployment ID — the commit SHA — and
      # the cancel is addressed to that ID. A retry started straight after a
      # timeout has come back "Deployment cancelled" within seconds (Nov 6,
      # 2026), so each retry first waits for the previous cancel to land.
      # `continue-on-error` keeps a failed attempt from failing the job so the
      # next one gets a turn; the last attempt fails the job for real.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Let the cancelled deployment settle
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Let the cancelled deployment settle (again)
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (final retry)
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
