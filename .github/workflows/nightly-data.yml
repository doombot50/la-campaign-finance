# Nightly data refresh — keeps the dashboard's data current with zero paid infra.
#
#   1. Seeds .la_cache/ from the rolling `data-cache` GitHub release
#   2. Re-downloads the current-cycle contributions/expenditures/loans
#      (plus any missing historical bundles — one-time backfill)
#   3. Builds the entity table, then retags records (party + isTransfer),
#      then rebuilds the candidate career index and insight blocks from the
#      freshly tagged records — totals recalculated nightly, transfer-aware
#   4. Uploads refreshed cache snapshots back to the release (--clobber)
#   5. Runs an incremental COH scrape (new filers + 30-day stale recheck)
#   6. Commits ethics_coh_cache.json if changed -> push -> Render auto-deploys,
#      and the deploy's buildCommand re-bakes the warm cache into the image.
#
# The COH step is self-completing: it processes top-raised-first and saves
# incrementally, so even if the first runs hit the step timeout, each night
# chips further down the list until the whole index is covered.

name: Nightly data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'   # nightly, 3-4am Central

concurrency:
  group: nightly-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"   # live log lines, not minutes-late chunks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependency
        run: pip install pdfplumber

      - name: Ensure data-cache release exists
        run: |
          gh release view data-cache >/dev/null 2>&1 || \
            gh release create data-cache --prerelease --latest=false \
              --title "Data cache (rolling)" \
              --notes "Rolling .la_cache snapshots, refreshed nightly. Not a software release."

      - name: Seed .la_cache from release assets
        run: |
          mkdir -p .la_cache
          gh release download data-cache --dir .la_cache --pattern '*.json.gz' \
            || echo "No assets yet (first run) — refresh step will download everything."

      - name: Refresh contribution/expenditure/loan caches
        run: python refresh_la_cache.py

      - name: Build canonical entity table
        # Joins the fresh records to party/COH/career/race data once, centrally.
        # Runs BEFORE retag_caches.py so the transfer-flagging pass always has
        # a same-night entity table (it used to read the previous night's copy
        # from the release seed — which never existed on the first runs, so no
        # records ever got isTransfer flags).
        # Output la_entities.json.gz ships with the upload glob below.
        run: python build_entities.py

      - name: Re-tag party labels + flag transfers on cached records
        # lookup_party improvements and la_politicians_lookup.json corrections
        # propagate to ALL year files (incl. old cycles seeded from the release,
        # which are otherwise never re-parsed). Also sets isTransfer on
        # committee-to-committee contributions using the entity table built above.
        run: python retag_caches.py

      - name: Rebuild candidate career index
        # Recalculates per-candidate/committee totals from the freshly retagged
        # records (transfer-aware). Output .la_cache/la_candidate_index.json.gz
        # ships with the upload glob below and overrides the committed copy on
        # the server, so search/profile totals stay in sync with the records.
        run: python build_candidate_index.py

      - name: Build per-entity lifetime edge lists
        # Top donors-in (by filer) and recipients-out (by donor name) per entity,
        # so the profile's lifetime giving/receiving lists render row-free.
        # Outputs .la_cache/la_entity_donors.json.gz + la_entity_giving.json.gz —
        # both ship via the upload glob; build_pages_site.py shards the giving
        # map for Pages. Needs only the refreshed contributions_yr*.json.gz.
        run: python build_entity_profiles.py

      - name: Resolve donor identities
        # Conservative A+B+C clustering (punctuation/initial/nickname within
        # same surname+suffix+ZIP; orgs by name) so the donor leaderboard isn't
        # split across spellings. Output la_donor_entities.json.gz feeds insights
        # below and ships via the upload glob.
        run: python build_donor_entities.py

      - name: Build precomputed insight blocks
        # War chests, top donors, party totals, monthly flow, transfer rollup.
        # Runs after retag so isTransfer flags are visible to the rollups.
        run: python build_insights.py

      - name: Build static API artifacts
        # Static twins of /api/search, /api/races, /api/overview, and
        # /api/industry-breakdown — the foundation of the server-less
        # deployment. Built from the same functions the live endpoints call.
        run: python build_static_api.py

      - name: Static parity gate
        # Boots the server against this run's caches and asserts the static
        # artifacts match the live API byte-for-byte. A mismatch fails the
        # run BEFORE upload, so a drifted artifact can never ship.
        run: python test_static_parity.py

      - name: Static client parity gate
        # Runs the SHIPPED static_api.js in Node against the live server and
        # asserts the client-side joins (candidate-history, search ranking,
        # races filtering, record streams) reproduce the API exactly.
        run: node test_static_client_parity.mjs

      - name: Upload cache snapshots to release
        run: gh release upload data-cache .la_cache/*.json.gz --clobber

      - name: Publish donations export for the pay-to-play tool
        # Flat-file handoff to the la-pay-to-play repo (build_p2p_export.py,
        # stdlib only). Reads the freshly refreshed .la_cache contributions and
        # ships cf_donations.csv.gz on the same data-cache release; that repo's
        # deploy-pages workflow pulls it. Decoupled: a failure here never affects
        # the dashboard.
        continue-on-error: true
        run: |
          python build_p2p_export.py --since 2015 --out cf_donations.csv
          gzip -f cf_donations.csv
          gh release upload data-cache cf_donations.csv.gz --clobber

      - name: Incremental COH scrape
        timeout-minutes: 125      # backstop only — the inner timeout fires first
        continue-on-error: true   # partial progress is saved + committed below
        # coreutils timeout guarantees the python process is DEAD before the
        # commit step runs. The Actions step timeout alone left it alive as an
        # orphan that kept rewriting ethics_coh_cache.json mid-commit, which
        # made `git pull --rebase` refuse ("unstaged changes") and threw away
        # the whole night's scrape progress. The scraper saves incrementally
        # with atomic writes, so a TERM here loses at most the in-flight filer.
        run: timeout --signal=TERM --kill-after=60 115m python fetch_ethics_coh.py --recheck 30 || true

      - name: Commit COH cache if changed
        if: always()
        run: |
          # Never commit a corrupt cache: if the JSON doesn't parse (e.g. the
          # scrape was killed mid-write), restore the last good version.
          python -c "import json; json.load(open('ethics_coh_cache.json'))" \
            || git checkout -- ethics_coh_cache.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ethics_coh_cache.json
          if git diff --cached --quiet; then
            echo "COH cache unchanged — nothing to commit."
          else
            git commit -m "Nightly COH cache refresh"
            # --autostash: tolerate any stray working-tree changes so a push
            # race with daytime merges can't strand the night's progress again
            git pull --rebase --autostash origin main
            git push
          fi
