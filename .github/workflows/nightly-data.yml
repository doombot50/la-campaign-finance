# Nightly data refresh — keeps the dashboard's data current with zero paid infra.
#
#   1. Seeds .la_cache/ from the rolling `data-cache` GitHub release
#   2. Re-downloads the current-cycle contributions/expenditures/loans
#   3. Runs an incremental COH scrape (new filers + 30-day stale recheck)
#   4. Uploads refreshed cache snapshots back to the release (--clobber)
#   5. Commits ethics_coh_cache.json if changed -> push -> Render auto-deploys,
#      and the deploy's buildCommand re-bakes the warm cache into the image.
#
# The COH step is self-completing: it processes top-raised-first and saves
# incrementally, so even if the first runs hit the step timeout, each night
# chips further down the list until the whole index is covered.

name: Nightly data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'   # nightly, 3-4am Central

concurrency:
  group: nightly-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"   # live log lines, not minutes-late chunks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependency
        run: pip install pdfplumber

      - name: Ensure data-cache release exists
        run: |
          gh release view data-cache >/dev/null 2>&1 || \
            gh release create data-cache --prerelease --latest=false \
              --title "Data cache (rolling)" \
              --notes "Rolling .la_cache snapshots, refreshed nightly. Not a software release."

      - name: Seed .la_cache from release assets
        run: |
          mkdir -p .la_cache
          gh release download data-cache --dir .la_cache --pattern '*.json.gz' \
            || echo "No assets yet (first run) — refresh step will download everything."

      - name: Refresh contribution/expenditure/loan caches
        run: python refresh_la_cache.py

      - name: Upload cache snapshots to release
        run: gh release upload data-cache .la_cache/*.json.gz --clobber

      - name: Incremental COH scrape
        timeout-minutes: 120
        continue-on-error: true   # partial progress is saved + committed below
        run: python fetch_ethics_coh.py --recheck 30

      - name: Commit COH cache if changed
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ethics_coh_cache.json
          if git diff --cached --quiet; then
            echo "COH cache unchanged — nothing to commit."
          else
            git commit -m "Nightly COH cache refresh"
            git pull --rebase origin main
            git push
          fi
